<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEZIS-SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-container">
        <img src="WEZIS-logo.png" alt="WEZIS Logo">
    </div>
    <div class="content-container">
        <h1>Welcome to WEZIS SignUp Page</h1>
        <form action="signup.php" method="POST">
            <h2>Personal Information</h2>
            <section class="form-section">
             <div class="form-row">  
            <div class="form-field">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" required placeholder="John">
            </div>
            <div class="form-field">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" required placeholder="Doe">
            </div>
         
             </div>
             <div class="form-row">
        
              <div class="form-field">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="888-888-8888">
            </div>


             <div class="form-field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="forexample@gmail.com">
            </div>
        </div>
        <div class="form-row">
           <div class="form-field">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

           

            <div class="form-field">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
        </div>
            </section>

            <input type="submit" value="Sign Up">
        </form>
        
    </div>

</body>
</html>
